name: CI

on:
  push:
    branches: [main, refactoring]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Same target you run locally, so CI cannot drift from the Makefile.
      - run: make check
